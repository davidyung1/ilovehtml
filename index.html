<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I love HTML</title><body><header><a class="brand" href="/">I <span>♥</span> HTML</a><label class="small" for="file">選擇 HTML</label><input id="file" type="file" accept=".html,.htm,text/html" hidden></header><main><section id="start"><div class="file-icon">&lt; / &gt;</div><h1>編輯 HTML</h1><label class="primary upload" for="file">選擇 HTML 檔案</label><p>或將檔案拖放至此</p></section><section id="workspace" hidden><div class="toolbar"><strong id="filename"></strong><div class="actions"><button id="edit">編輯</button><button id="add" hidden disabled>新增段落</button><button id="remove" hidden disabled>刪除段落</button><button id="save" class="primary">儲存</button><button id="download" disabled>下載 HTML</button></div></div><div id="formatbar" class="formatbar" role="toolbar" aria-label="文字格式" hidden><label for="font-size">字號</label><input id="font-size" type="number" min="1" max="100" step="1" value="16" inputmode="numeric" autocomplete="off" aria-label="字號 px"><span>px</span><button data-format="bold" aria-label="粗體" title="粗體"><b>B</b></button><button data-format="italic" aria-label="斜體" title="斜體"><i>I</i></button><button data-format="underline" aria-label="底線" title="底線"><u>U</u></button><span class="color-label">文字顏色</span><button data-color="#243047" aria-label="深灰色" title="深灰色" style="--swatch:#243047"></button><button data-color="#2855e8" aria-label="藍色" title="藍色" style="--swatch:#2855e8"></button><button data-color="#dc2626" aria-label="紅色" title="紅色" style="--swatch:#dc2626"></button><button data-color="#15803d" aria-label="綠色" title="綠色" style="--swatch:#15803d"></button><button data-color="#a16207" aria-label="金黃色" title="金黃色" style="--swatch:#a16207"></button><button data-color="#7e22ce" aria-label="紫色" title="紫色" style="--swatch:#7e22ce"></button></div><div id="message" role="status" aria-live="polite"></div><iframe id="frame" title="HTML 預覽" sandbox="allow-scripts"></iframe><aside id="share" hidden><strong>已儲存</strong><input id="link" readonly aria-label="分享連結"><button id="copy">複製連結</button><span id="expiry"></span></aside></section></main><script type="module" src="/src/app.js"></script></body></html>
