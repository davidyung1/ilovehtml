<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>示範公司營運匯報</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#243047;font-family:system-ui,'Microsoft JhengHei',sans-serif;padding:4vw}h1{font-size:clamp(30px,4vw,60px);line-height:1.2}p,li{font-size:21px;line-height:1.9}button{background:#2855e8;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;font:inherit}button:focus-visible,input:focus-visible{outline:3px solid #eb6170}svg{width:100%;height:220px}section{background:white;padding:26px;border-radius:16px}small{color:#748099}input{accent-color:#2855e8}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}.charts{display:grid;grid-template-columns:1fr 1fr;gap:22px}.metrics{display:flex;justify-content:space-between;gap:20px;margin:30px 0}.metrics strong{display:block;font-size:40px;color:#2855e8}.note{max-width:1000px}footer{margin:30px 0;color:#748099}@media(max-width:650px){.charts{grid-template-columns:1fr}.metrics{flex-direction:column}}path,rect,circle{transition:all .4s}</style><header><strong>示範公司</strong></header><h1>2026 年第三季營運匯報</h1><p>匯報日期：2026 年 11 月 16 日</p><p class="note">本季我們持續改善產品體驗，透過清晰的數據與團隊回顧，規劃下一階段的工作。</p><label for="growth">下季成長情境 </label><input id="growth" type="range" min="0" max="30" value="10"><output id="rate">10%</output><div class="metrics"><div>預估營收<strong id="revenue">132 萬</strong></div><div>目標完成度<strong id="completion">88%</strong></div><div><span>客戶滿義度</span><strong>92%</strong></div></div><div class="charts"><section><h2>營收趨勢</h2><svg viewBox="0 0 480 220" role="img"><path d="M20 170H460M20 110H460M20 50H460" stroke="#e4eaf6"/><path id="trend" fill="none" stroke="#2855e8" stroke-width="5"/><text x="20" y="210">七月</text><text x="160" y="210">八月</text><text x="300" y="210">九月</text><text x="420" y="210">預估</text></svg></section><section><h2>部門表現</h2><svg viewBox="0 0 480 220" role="img"><text x="5" y="45">產品</text><text x="5" y="105">營運</text><text x="5" y="165">服務</text><rect id="bar1" x="65" y="22" height="30" rx="5" fill="#2855e8"/><rect id="bar2" x="65" y="82" height="30" rx="5" fill="#2855e8"/><rect id="bar3" x="65" y="142" height="30" rx="5" fill="#2855e8"/></svg></section><section><h2>費用分布</h2><svg viewBox="0 0 480 220" role="img"><rect x="20" y="40" width="220" height="65" fill="#2855e8"/><rect x="240" y="40" width="130" height="65" fill="#809cf5"/><rect x="370" y="40" width="90" height="65" fill="#eb6170"/><text x="20" y="150">人力 50%</text><text x="190" y="150">研發 30%</text><text x="350" y="150">其他 20%</text></svg></section><section><h2>目標完成度</h2><svg viewBox="0 0 480 220" role="img"><circle cx="240" cy="100" r="75" fill="none" stroke="#e4eaf6" stroke-width="22"/><circle id="ring" cx="240" cy="100" r="75" fill="none" stroke="#2855e8" stroke-width="22" transform="rotate(-90 240 100)"/><text id="ringText" x="240" y="112" text-anchor="middle" font-size="36">88%</text></svg></section></div><section style="margin-top:24px;background:#eaf0ff"><h2>團隊回顧與下一步</h2><p class="note">產品團隊將優先改善首次使用流程，讓新使用者更容易完成第一個任務。</p><p class="note">本季例行會議暫定於每週五舉行，細節將另行通知。</p><p class="note">下階段將根據使用者回饋，持續調整產品功能與內容。</p></section><footer>所有公司內容及數據均為虛構，僅作展示。</footer><script>const slider=document.getElementById('growth');function update(){const g=Number(slider.value),v=80+Math.round(g*.8);document.getElementById('rate').textContent=g+'%';document.getElementById('revenue').textContent=Math.round(120*(1+g/100))+' 萬';document.getElementById('completion').textContent=v+'%';document.getElementById('ringText').textContent=v+'%';document.getElementById('ring').setAttribute('stroke-dasharray',(v/100*471)+' 471');document.getElementById('trend').setAttribute('d','M20 160 L160 125 L300 100 L445 '+(100-g*2));[1,2,3].forEach(n=>document.getElementById('bar'+n).setAttribute('width',220+n*15+g*(4-n)));}slider.addEventListener('input',update);update();</script></html>
